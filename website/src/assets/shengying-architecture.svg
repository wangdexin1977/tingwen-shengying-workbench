<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img" aria-labelledby="title desc"><title id="title">听文声影工作台系统架构</title><desc id="desc">浏览器连接本机 Flask，文档与参数进入语音和图片处理，保存项目在队列执行，FFmpeg 输出 MP4，再交接 Chrome 今日头条上传。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f73b6" stroke-width="1.4"/></marker></defs><rect width="1080" height="710" rx="22" fill="#f5f8ff"/><g font-family="system-ui,PingFang SC,sans-serif" text-anchor="middle"><text x="540" y="48" font-size="25" font-weight="700" fill="#173666">本机制作 · 持久队列 · 用户确认发布</text><g fill="#fff" stroke="#b9cbea" stroke-width="1.5"><rect x="345" y="77" width="390" height="68" rx="12"/><rect x="345" y="181" width="390" height="78" rx="12"/><rect x="50" y="300" width="295" height="114" rx="12"/><rect x="393" y="300" width="295" height="114" rx="12"/><rect x="737" y="300" width="295" height="114" rx="12"/><rect x="130" y="456" width="355" height="76" rx="12"/><rect x="595" y="456" width="355" height="76" rx="12"/><rect x="280" y="572" width="520" height="88" rx="12"/></g><g fill="none" stroke="#4f73b6" stroke-width="2" marker-end="url(#arrow)"><path d="M540 145V181"/><path d="M430 259L197 300"/><path d="M540 259V300"/><path d="M650 259L884 300"/><path d="M197 414L307 456"/><path d="M540 414L770 456"/><path d="M884 414L770 456"/><path d="M485 494H595"/><path d="M770 532L650 572"/></g><g fill="#173666" font-size="21" font-weight="650"><text x="540" y="106">创作者 / 浏览器界面</text><text x="540" y="212">Flask 主区 8092 · 专业区 7862</text><text x="197" y="334">文案与语音</text><text x="540" y="334">保存与夜间队列</text><text x="884" y="334">照片与可选 AI 配图</text><text x="307" y="487">MP3 / WAV / FLAC</text><text x="773" y="487">FFmpeg → 1080p MP4</text><text x="540" y="604">统一成品入口 → Chrome 头条上传</text></g><g fill="#567299" font-size="16"><text x="540" y="130">四个工作区 · 参数自动保存</text><text x="540" y="240">JSON 任务 · 本机线程 / 独立子进程</text><text x="197" y="365">文档 / OCR / 音色库 / 参考 ASR</text><text x="197" y="391">六种本机后端 + 微软在线语音</text><text x="540" y="365">正文、图片副本与参数快照</text><text x="540" y="391">顺序制作 / MP3 复用 / 失败继续</text><text x="884" y="365">本机照片 / 公开图址</text><text x="884" y="391">Draw Things / Seedream</text><text x="307" y="513">独立任务与专业输出登记</text><text x="773" y="513">标题 / 字幕 / 音乐循环</text><text x="540" y="637">用户登录、核对标题标签并自行确认最终发布</text></g></g></svg>
